<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<title>科科打牌记分器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0b0a12;
  --table: #12111d;
  --card: #181725;
  --card-raised: #201e2f;
  --line: rgba(238, 235, 255, .075);
  --text: #f3f0f6;
  --muted: #85809a;
  --coral: #ff647c;
  --mint: #57d89b;
  --amber: #f6bd63;
  --ice: #9dd7ff;
  --avatar: linear-gradient(145deg, #343146, #211f30);
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--ink); -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; overflow-x: hidden; color: var(--text);
  background:
    radial-gradient(circle at 50% -10%, rgba(102, 77, 133, .18), transparent 34%),
    var(--ink);
  font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button, input { font: inherit; }
button { border: 0; color: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.mono { font-family: "DM Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.container { width: min(100%, 440px); margin: 0 auto; padding: 12px 12px 96px; }

.appbar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 6px 0 14px; }
.brand { text-align: center; }
.brand h1 { font-size: 16px; font-weight: 800; letter-spacing: .06em; }
.brand p { margin-top: 2px; color: var(--muted); font-size: 10px; letter-spacing: .18em; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.035);
  border: 1px solid var(--line); color: var(--muted); display: grid; place-items: center; padding: 0;
}
.more-icon { display: flex; align-items: center; justify-content: center; gap: 3px; width: 18px; height: 18px; }
.more-icon i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px rgba(255,255,255,.12); }
.icon-btn:active { transform: scale(.94); }

.score-table { overflow: hidden; background: rgba(18,17,29,.9); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 18px 48px rgba(0,0,0,.22); }
.table-header, .player-row { display: grid; grid-template-columns: 82px 1fr 76px; align-items: center; }
.table-header { min-height: 38px; padding: 0 12px; background: rgba(255,255,255,.018); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .08em; }
.table-header span { text-align: center; }
.table-header span:first-child { text-align: left; }
.player-row { position: relative; min-height: 92px; padding: 6px 12px; border-bottom: 1px solid var(--line); transition: background .3s ease; }
.player-row:last-child { border-bottom: 0; }
.player-row.auto-highlighted { background: rgba(246,189,99,.035); }
.avatar-cell { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.avatar {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none;
  background: var(--avatar); border: 1px solid rgba(255,255,255,.11); box-shadow: inset 0 1px rgba(255,255,255,.08), 0 6px 16px rgba(0,0,0,.24);
  color: #fff; font-size: 23px; font-weight: 650; line-height: 1; transition: transform .15s ease, border-color .2s ease;
}
.avatar:active { transform: scale(.93) rotate(-2deg); }
.rank-1 .avatar { border-color: rgba(255,210,101,.62); box-shadow: inset 0 1px rgba(255,255,255,.12), 0 0 0 2px rgba(246,189,99,.1), 0 7px 24px rgba(246,189,99,.18); }
.rank-2 .avatar { border-color: rgba(194,214,232,.42); box-shadow: inset 0 1px rgba(255,255,255,.1), 0 0 0 2px rgba(194,214,232,.06), 0 7px 20px rgba(155,183,207,.12); }
.rank-3 .avatar { border-color: rgba(215,145,91,.42); box-shadow: inset 0 1px rgba(255,255,255,.1), 0 0 0 2px rgba(215,145,91,.06), 0 7px 20px rgba(182,107,59,.12); }
.rank-medal { position: absolute; z-index: 3; top: -5px; left: 39px; min-width: 21px; height: 21px; padding: 0 5px; display: grid; place-items: center; border-radius: 99px; border: 2px solid var(--table); background: #302d3d; color: #b8b2c4; font: 800 9px/1 "DM Mono", monospace; }
.rank-1 .rank-medal { background: linear-gradient(145deg,#ffe08a,#d99634); color: #392108; box-shadow: 0 0 13px rgba(246,189,99,.38); }
.rank-2 .rank-medal { background: linear-gradient(145deg,#e7eef4,#93a7b9); color: #26313c; }
.rank-3 .rank-medal { background: linear-gradient(145deg,#e5a06a,#9b5835); color: #30170b; }
.avatar-hint { max-width: 72px; overflow: hidden; color: #777188; font-size: 9px; white-space: nowrap; text-overflow: ellipsis; }
.total-wrap { min-width: 0; text-align: center; }
.total-score { font-size: 36px; font-weight: 500; line-height: 1.05; letter-spacing: -.05em; transition: color .25s ease; }
.total-score.positive { color: var(--coral); }
.total-score.negative { color: var(--mint); }
.total-score.zero { color: #777188; }
.player-title { height: 17px; margin-top: 5px; color: var(--amber); font-size: 9px; letter-spacing: .04em; white-space: nowrap; }
.player-title.empty { color: #5f5a6e; }

.wheel-cell { display: flex; justify-content: center; }
.wheel-container { width: 60px; height: 100px; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
.wheel-track { position: absolute; width: 100%; left: 0; transition: transform .3s cubic-bezier(.22,1,.36,1); }
.wheel-item { height: 34px; display: grid; place-items: center; font: 500 18px/1 "DM Mono", monospace; opacity: .13; transition: opacity .18s, transform .18s; user-select: none; }
.wheel-item.active { opacity: 1; transform: scale(1.1); }
.wheel-item.adjacent { opacity: .3; }
.wheel-container::before, .wheel-container::after { content: ""; position: absolute; z-index: 2; left: 0; right: 0; height: 33px; pointer-events: none; }
.wheel-container::before { top: 0; background: linear-gradient(var(--table), transparent); }
.wheel-container::after { bottom: 0; background: linear-gradient(transparent, var(--table)); }
.wheel-indicator { position: absolute; z-index: 1; top: 50%; left: 50%; width: 56px; height: 34px; transform: translate(-50%,-50%); border: 1px solid rgba(255,255,255,.105); border-radius: 10px; background: rgba(255,255,255,.015); pointer-events: none; }
.auto-highlighted .wheel-indicator { border-color: rgba(246,189,99,.4); box-shadow: 0 0 16px rgba(246,189,99,.08); }
.score-flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.score-flash.pos { background: radial-gradient(circle at 48% 50%, rgba(255,100,124,.14), transparent 45%); }
.score-flash.neg { background: radial-gradient(circle at 48% 50%, rgba(87,216,155,.12), transparent 45%); }
.score-flash.show { animation: flash .8s ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes scorePulse { 50% { transform: scale(1.16); } }
.total-score.animating { animation: scorePulse .5s ease; }

.action-row { display: grid; grid-template-columns: 82px 82px 1fr; gap: 7px; padding: 12px 0 4px; }
.bomb-btn, .quick-btn, .submit-btn { min-height: 54px; border-radius: 17px; font-weight: 700; transition: transform .15s, filter .15s; }
.bomb-btn { background: #1b1928; border: 1px solid var(--line); color: #bab4c9; font-size: 13px; }
.quick-btn { background: rgba(157,215,255,.055); border: 1px solid rgba(157,215,255,.1); color: #c5dff0; font-size: 13px; }
.bomb-btn span, .quick-btn span { display: block; color: #777188; font-size: 8px; font-weight: 400; margin-top: 1px; }
.submit-btn { position: relative; overflow: hidden; background: linear-gradient(135deg, #ff647c, #d94b68); color: white; font-size: 16px; letter-spacing: .12em; box-shadow: 0 8px 24px rgba(217,75,104,.22); }
.submit-btn:active, .bomb-btn:active, .quick-btn:active { transform: scale(.975); filter: brightness(.94); }

.history-section { margin-top: 20px; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 8px; color: var(--muted); font-size: 12px; letter-spacing: .1em; }
.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-item { display: grid; grid-template-columns: 34px minmax(0,1fr) 42px; align-items: center; gap: 4px; min-height: 58px; padding: 7px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; }
.history-item.newest { animation: historyIn .35s ease-out; }
@keyframes historyIn { from { opacity: 0; transform: translateY(-8px); } }
.history-round { color: #777188; font-size: 10px; text-align: center; }
.history-round b { display: block; margin-top: 2px; color: var(--amber); font-size: 8px; }
.history-scores { --players: 4; display: grid; grid-template-columns: repeat(var(--players), minmax(0,1fr)); align-items: center; }
.history-score-item { min-width: 0; display: grid; grid-template-columns: 20px minmax(0,1fr); justify-content: center; align-items: center; column-gap: 3px; font: 500 11px/1 "DM Mono", monospace; font-variant-numeric: tabular-nums; }
.mini-avatar { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 7px; background: var(--avatar); border: 1px solid rgba(255,255,255,.09); color: white; font-family: "Noto Sans SC", sans-serif; font-size: 9px; line-height: 1; }
.history-score-info { min-width: 0; }
.history-score-item .value { display: block; width: 3.3ch; text-align: left; }
.round-role { display: block; max-width: 48px; margin-top: 4px; overflow: hidden; color: #6f697e; font: 500 7px/1 "Noto Sans SC", sans-serif; white-space: nowrap; text-overflow: ellipsis; }
.history-score-item.is-winner .round-role { color: var(--amber); }
.undo-btn { width: 40px; height: 28px; border-radius: 8px; background: transparent; border: 1px solid rgba(255,100,124,.18); color: var(--coral); font-size: 10px; }
.show-more-btn { width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; background: transparent; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.no-history { padding: 26px 0; text-align: center; color: #686276; font-size: 12px; }

.modal { position: fixed; z-index: 500; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(4,3,8,.78); backdrop-filter: blur(9px); }
.modal.active { display: flex; }
.sheet { width: min(100%,440px); max-height: 88vh; overflow: auto; padding: 20px 16px calc(24px + env(safe-area-inset-bottom)); background: #171522; border: 1px solid var(--line); border-radius: 24px 24px 0 0; animation: sheetUp .28s ease-out; }
@keyframes sheetUp { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-head h2 { font-size: 17px; }
.close-btn { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.05); color: var(--muted); }
.sheet-label { margin: 16px 0 8px; color: var(--muted); font-size: 11px; letter-spacing: .1em; }
.symbol-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; }
.symbol-option { aspect-ratio: 1; border-radius: 12px; background: rgba(255,255,255,.045); border: 1px solid transparent; font-size: 21px; }
.symbol-option.current { border-color: var(--amber); background: rgba(246,189,99,.08); }
.custom-row { display: grid; grid-template-columns: 1fr 84px; gap: 8px; }
.custom-input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.035); color: var(--text); }
.primary-small { border-radius: 12px; background: var(--amber); color: #24180c; font-size: 13px; font-weight: 700; }
.picker-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.picker-option { min-height: 48px; border-radius: 13px; background: rgba(255,255,255,.045); border: 1px solid transparent; font-size: 14px; }
.picker-option.selected { border-color: var(--amber); color: var(--amber); background: rgba(246,189,99,.07); }
.bomb-preview { margin: 16px 0; padding: 12px; background: rgba(255,255,255,.035); border-radius: 13px; color: var(--muted); font-size: 12px; line-height: 1.7; text-align: center; }
.wide-primary { width: 100%; height: 50px; border-radius: 14px; background: var(--amber); color: #24180c; font-weight: 800; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.setting-copy b { display: block; font-size: 14px; }
.setting-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
.switch { width: 48px; height: 28px; padding: 3px; border-radius: 99px; background: #2c2938; transition: background .2s; }
.switch::after { content: ""; display: block; width: 22px; height: 22px; border-radius: 50%; background: #8d879b; transition: transform .2s, background .2s; }
.switch.on { background: rgba(87,216,155,.3); }
.switch.on::after { transform: translateX(20px); background: var(--mint); }
.identity-list { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.identity-item { min-height: 44px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 13px; }
.confirm-copy { color: var(--muted); font-size: 12px; line-height: 1.7; text-align: center; margin: -5px 0 14px; }
.setting-controls { display: flex; align-items: center; gap: 8px; }
.preview-btn { height: 28px; padding: 0 9px; border-radius: 8px; background: rgba(246,189,99,.09); border: 1px solid rgba(246,189,99,.18); color: var(--amber); font-size: 10px; }
.settings-menu { display: flex; flex-direction: column; gap: 8px; }
.menu-row { width: 100%; min-height: 50px; padding: 0 13px; display: flex; align-items: center; gap: 11px; border-radius: 13px; background: rgba(255,255,255,.035); border: 1px solid var(--line); color: var(--text); text-decoration: none; text-align: left; }
.menu-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: rgba(255,255,255,.05); font-size: 14px; }
.menu-copy { flex: 1; }
.menu-copy b { display: block; font-size: 13px; }
.menu-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
.menu-arrow { color: #656073; font-size: 16px; }
.profile-hero { display: grid; grid-template-columns: 68px 1fr; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: radial-gradient(circle at 10% 10%,rgba(246,189,99,.1),transparent 50%),rgba(255,255,255,.025); }
.profile-avatar { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 19px; background: var(--avatar); border: 1px solid rgba(255,255,255,.12); font-size: 27px; }
.profile-current { color: var(--amber); font-size: 15px; font-weight: 800; }
.profile-rank { margin-top: 4px; color: var(--muted); font-size: 11px; }
.profile-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 10px; }
.profile-stat { padding: 9px 4px; border-radius: 12px; background: rgba(255,255,255,.035); text-align: center; }
.profile-stat b { display: block; color: var(--text); font: 600 14px/1 "DM Mono", monospace; }
.profile-stat span { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; }
.title-history { display: flex; flex-direction: column; gap: 6px; }
.title-record { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 8px; padding: 10px 11px; border-radius: 12px; background: rgba(255,255,255,.032); border: 1px solid var(--line); }
.title-record .round { color: #716b80; font: 500 9px/1 "DM Mono", monospace; }
.title-record b { font-size: 12px; }
.title-record .score { font: 500 12px/1 "DM Mono", monospace; }
.profile-empty { padding: 28px 12px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.8; }
.quick-score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.quick-score { min-height: 52px; border-radius: 13px; background: rgba(255,255,255,.045); border: 1px solid var(--line); color: var(--coral); font: 600 17px/1 "DM Mono", monospace; }
.quick-score small { display: block; margin-top: 5px; color: var(--muted); font: 400 8px/1 "Noto Sans SC", sans-serif; }

.settlement { position: fixed; z-index: 900; inset: 0; display: none; padding: 16px 0; overflow: hidden; background: rgba(7,6,13,.14); backdrop-filter: blur(1.5px) saturate(.92); pointer-events: none; }
.settlement.active { display: grid; place-items: center; }
.settlement.leaving { display: grid; animation: overlayOut .34s ease forwards; }
.settlement-panel { position: relative; z-index: 2; width: min(92vw,390px); padding: 22px 18px 16px; overflow: hidden; display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(255,255,255,.13); border-radius: 26px; background: radial-gradient(circle at 50% 0%, rgba(246,189,99,.17), transparent 38%), rgba(15,13,24,.78); box-shadow: 0 22px 70px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.07); backdrop-filter: blur(13px) saturate(1.15); animation: settlementIn .42s cubic-bezier(.16,1,.3,1); }
.settlement-panel::before, .settlement-panel::after { content: ""; position: absolute; top: 0; width: 34%; height: 1px; background: linear-gradient(90deg,transparent,var(--amber)); }
.settlement-panel::before { left: 0; }
.settlement-panel::after { right: 0; transform: scaleX(-1); }
@keyframes settlementIn { from { opacity: 0; transform: translateY(16px) scale(.9); filter: blur(5px); } 65% { transform: translateY(-2px) scale(1.015); } }
@keyframes overlayOut { to { opacity: 0; transform: scale(1.035); } }
.settlement-kicker { color: #d5cedd; font: 500 9px/1 "DM Mono", monospace; letter-spacing: .16em; opacity: .72; }
.settlement-rank { margin-top: 9px; padding: 5px 12px; border: 1px solid rgba(246,189,99,.28); border-radius: 99px; background: rgba(246,189,99,.08); color: var(--amber); font-size: 11px; font-weight: 800; letter-spacing: .14em; box-shadow: 0 0 22px rgba(246,189,99,.08); animation: rankPulse 1s ease-in-out infinite alternate; }
@keyframes rankPulse { to { box-shadow: 0 0 30px rgba(246,189,99,.23); transform: scale(1.025); } }
.settlement-title { position: relative; margin-top: 10px; font-size: 31px; font-weight: 900; letter-spacing: -.05em; line-height: 1.15; text-align: center; text-shadow: 0 5px 24px rgba(0,0,0,.42); }
.settlement-title::before, .settlement-title::after { content: "◆"; margin: 0 8px; color: var(--amber); font-size: 8px; vertical-align: middle; opacity: .65; }
.settlement-copy { min-height: 20px; margin-top: 7px; color: #b8b2c4; font-size: 11px; line-height: 1.55; text-align: center; }
.winner-stack { width: 100%; margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
.result-card { min-width: 78px; padding: 8px; text-align: center; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; backdrop-filter: blur(4px); }
.result-card.winner { min-width: 68px; border-color: rgba(246,189,99,.4); background: radial-gradient(circle at 50% 30%,rgba(246,189,99,.14),rgba(255,255,255,.04)); box-shadow: 0 0 36px rgba(246,189,99,.14); animation: winnerFloat 1.15s ease-in-out infinite alternate; }
@keyframes winnerFloat { to { transform: translateY(-5px) scale(1.03); } }
.result-avatar { width: 45px; height: 45px; margin: 0 auto 5px; display: grid; place-items: center; border-radius: 15px; background: var(--avatar); border: 1px solid rgba(255,255,255,.15); font-size: 21px; }
.result-score { color: var(--coral); font: 500 17px/1 "DM Mono", monospace; }
.result-role { margin-top: 5px; color: var(--amber); font-size: 8px; }
.transfer-zone { position: relative; width: 100%; height: 46px; overflow: hidden; }
.flying-token { position: absolute; left: calc(50% - 9px); top: 2px; color: var(--amber); font-size: 17px; text-shadow: 0 0 14px currentColor; animation: tokenRise 1s cubic-bezier(.2,.7,.2,1) infinite; }
.flying-token:nth-child(2) { margin-left: -35px; animation-delay: .18s; }
.flying-token:nth-child(3) { margin-left: 35px; animation-delay: .36s; }
.flying-token:nth-child(4) { animation-delay: .54s; }
@keyframes tokenRise { 0% { opacity: 0; transform: translateY(36px) scale(.55) rotate(-18deg); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(-7px) scale(1.18) rotate(10deg); } }
.loser-stack { display: flex; justify-content: center; gap: 7px; width: 100%; }
.loser-stack .result-card { min-width: 0; flex: 1; padding: 7px 4px; }
.loser-stack .result-avatar { width: 36px; height: 36px; font-size: 17px; border-radius: 12px; opacity: .78; }
.loser-stack .result-score { color: var(--mint); font-size: 13px; }
.settlement-achievement { min-height: 23px; margin-top: 12px; padding: 6px 10px; border-radius: 99px; background: rgba(246,189,99,.1); border: 1px solid rgba(246,189,99,.12); color: var(--amber); font-size: 10px; }
.auto-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.05); }
.auto-progress::after { content: ""; display: block; height: 100%; background: linear-gradient(90deg,var(--amber),var(--coral)); transform-origin: left; animation: progressDrain var(--settlement-duration,2200ms) linear forwards; }
@keyframes progressDrain { to { transform: scaleX(0); } }
.weather { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.motion-layer { position: absolute; z-index: 4; inset: 0; overflow: hidden; pointer-events: none; }
.score-orb { position: absolute; width: 14px; height: 14px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#fff6bd,#f5ae3c 48%,#9d4f16); color: #3b2107; font: 900 7px/1 "DM Mono",monospace; box-shadow: 0 0 18px rgba(255,190,78,.85); }
.impact-ring { position: absolute; z-index: 3; width: 46px; height: 46px; border: 2px solid rgba(255,221,135,.72); border-radius: 50%; opacity: 0; box-shadow: 0 0 22px rgba(255,190,78,.35); }
.screen-flash { position: absolute; z-index: 5; inset: 0; opacity: 0; background: radial-gradient(circle,rgba(255,238,175,.34),transparent 58%); mix-blend-mode: screen; }
.snow { position: absolute; top: -30px; color: var(--ice); opacity: .75; animation: snowfall linear infinite; }
@keyframes snowfall { to { transform: translate3d(30px,110vh,0) rotate(180deg); } }
.effect-epic .settlement-panel { background: radial-gradient(circle at 50% 10%, rgba(102,178,236,.26), transparent 40%), rgba(10,13,24,.76); box-shadow: 0 0 100px rgba(80,160,230,.23); }
.effect-epic .settlement-title { color: #e4f5ff; text-shadow: 0 0 28px rgba(157,215,255,.42); }
.effect-epic .settlement-rank { color: var(--ice); border-color: rgba(157,215,255,.35); background: rgba(157,215,255,.09); }
.effect-bomb .settlement-panel { background: radial-gradient(circle at 50% 8%, rgba(255,166,77,.3), transparent 42%), rgba(24,12,15,.78); box-shadow: 0 0 100px rgba(255,112,52,.2); }
.effect-bomb .settlement-rank { color: #ffd37d; border-color: rgba(255,174,73,.42); background: rgba(255,151,55,.12); }
.effect-small .flying-token { font-size: 15px; }
.effect-medium .transfer-zone { filter: drop-shadow(0 0 8px rgba(246,189,99,.28)); }
.effect-large .settlement-panel { background: radial-gradient(circle at 50% 8%, rgba(255,100,124,.23), transparent 42%), rgba(18,12,23,.77); box-shadow: 0 0 90px rgba(255,100,124,.2); }
.effect-large .transfer-zone { filter: drop-shadow(0 0 12px rgba(255,100,124,.28)); }
.effect-large .flying-token { font-size: 21px; animation-duration: .95s; }
.gust { position: absolute; color: rgba(157,215,255,.55); font-size: 20px; animation: gustAcross 1.2s ease-in-out infinite; }
.spark { position: absolute; color: #ffd064; font-size: 13px; text-shadow: 0 0 12px currentColor; animation: sparkBurst 1.1s ease-out infinite; }
@keyframes gustAcross { from { transform: translateX(-24vw) rotate(-8deg); opacity: 0; } 40% { opacity: .65; } to { transform: translateX(120vw) rotate(8deg); opacity: 0; } }
@keyframes sparkBurst { from { opacity: 0; transform: translate(0,0) scale(.4); } 35% { opacity: 1; } to { opacity: 0; transform: translate(var(--sx),var(--sy)) scale(1.1) rotate(120deg); } }
.toast { position: fixed; z-index: 1000; top: calc(54px + env(safe-area-inset-top)); left: 50%; max-width: calc(100vw - 36px); padding: 10px 16px; transform: translate(-50%,-14px); opacity: 0; border: 1px solid var(--line); border-radius: 12px; background: #252233; color: var(--text); font-size: 12px; white-space: nowrap; transition: .25s ease; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%,0); }

@media (max-width: 360px) {
  .container { padding-inline: 8px; }
  .table-header, .player-row { grid-template-columns: 70px 1fr 68px; padding-inline: 9px; }
  .avatar { width: 46px; height: 46px; border-radius: 14px; }
  .total-score { font-size: 32px; }
  .history-item { grid-template-columns: 30px minmax(0,1fr) 38px; padding-inline: 5px; }
  .action-row { grid-template-columns: 72px 72px 1fr; gap: 5px; }
  .bomb-btn, .quick-btn { font-size: 12px; }
  .history-score-item { grid-template-columns: 18px minmax(0,1fr); column-gap: 1px; font-size: 10px; }
  .mini-avatar { width: 18px; height: 18px; }
  .round-role { max-width: 39px; font-size: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="container">
  <header class="appbar">
    <span></span>
    <div class="brand"><h1>科科打牌记分器</h1><p>今晚谁来收租</p></div>
    <button class="icon-btn" type="button" aria-label="设置" onclick="openSettings()"><span class="more-icon" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </header>

  <section class="score-table" aria-label="玩家计分">
    <div class="table-header"><span>玩家</span><span>总分</span><span>本轮</span></div>
    <div id="playerRows"></div>
  </section>

  <div class="action-row">
    <button class="quick-btn" type="button" onclick="openQuickModal()">⚡ 速填<span>单赢家均摊</span></button>
    <button class="bomb-btn" type="button" onclick="openBombModal()">💣 炸弹<span>统一收 2 / 4</span></button>
    <button class="submit-btn" type="button" id="submitBtn" onclick="submitScores()">提交分数</button>
  </div>

  <section class="history-section">
    <div class="section-title"><span>历史轮次</span><span id="roundCount"></span></div>
    <div id="historyList" class="history-list"><div class="no-history">第一轮还没开张</div></div>
    <button class="show-more-btn" type="button" id="showMoreBtn" hidden onclick="toggleShowAll()">显示全部</button>
  </section>

</main>

<div class="settlement" id="settlement" role="status" aria-live="assertive" aria-hidden="true">
  <div class="weather" id="weather"></div>
  <div class="motion-layer" id="motionLayer"></div>
  <div class="screen-flash" id="screenFlash"></div>
  <div class="settlement-panel">
    <div class="settlement-kicker" id="settlementKicker">本轮战报</div>
    <div class="settlement-rank" id="settlementRank">火力全开</div>
    <h2 class="settlement-title" id="settlementTitle"></h2>
    <p class="settlement-copy" id="settlementCopy"></p>
    <div class="winner-stack" id="winnerStack"></div>
    <div class="transfer-zone" id="transferZone"></div>
    <div class="loser-stack" id="loserStack"></div>
    <div class="settlement-achievement" id="settlementAchievement"></div>
    <div class="auto-progress"></div>
  </div>
</div>

<div class="modal" id="identityModal" role="dialog" aria-modal="true" aria-labelledby="identityTitle" onclick="closeOnBackdrop(event,'identityModal')">
  <div class="sheet">
    <div class="sheet-head"><h2 id="identityTitle">换一个身份标记</h2><button class="close-btn" type="button" onclick="closeModal('identityModal')">✕</button></div>
    <div class="symbol-grid" id="symbolGrid"></div>
    <div class="sheet-label">也可以写一两个字</div>
    <div class="custom-row"><input class="custom-input" id="customSymbol" maxlength="16" placeholder="例如：科 / 老王" autocomplete="off"><button class="primary-small" type="button" onclick="saveCustomSymbol()">使用</button></div>
  </div>
</div>

<div class="modal" id="bombModal" role="dialog" aria-modal="true" aria-labelledby="bombTitle" onclick="closeOnBackdrop(event,'bombModal')">
  <div class="sheet">
    <div class="sheet-head"><h2 id="bombTitle">💣 炸弹收取</h2><button class="close-btn" type="button" onclick="closeModal('bombModal')">✕</button></div>
    <div class="sheet-label">谁放的炸弹</div><div class="picker-grid" id="bombWinnerPicker"></div>
    <div class="sheet-label">每人支付</div><div class="picker-grid" id="bombRatePicker"></div>
    <div class="bomb-preview" id="bombPreview"></div>
    <button class="wide-primary" type="button" onclick="applyBomb()">直接结算炸弹</button>
  </div>
</div>

<div class="modal" id="quickModal" role="dialog" aria-modal="true" aria-labelledby="quickTitle" onclick="closeOnBackdrop(event,'quickModal')">
  <div class="sheet">
    <div class="sheet-head"><h2 id="quickTitle">⚡ 单赢家速填</h2><button class="close-btn" type="button" onclick="closeModal('quickModal')">✕</button></div>
    <div class="sheet-label">本轮赢家</div><div class="picker-grid" id="quickWinnerPicker"></div>
    <div class="sheet-label">赢家得分</div><div class="quick-score-grid" id="quickScorePicker"></div>
    <div class="bomb-preview" id="quickPreview">选择得分后会自动均摊给其他玩家，回到牌桌仍可微调。</div>
  </div>
</div>

<div class="modal" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileTitle" onclick="closeOnBackdrop(event,'profileModal')">
  <div class="sheet">
    <div class="sheet-head"><h2 id="profileTitle">个人战报</h2><button class="close-btn" type="button" onclick="closeModal('profileModal')">✕</button></div>
    <div id="profileContent"></div>
  </div>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" onclick="closeOnBackdrop(event,'settingsModal')">
  <div class="sheet">
    <div class="sheet-head"><h2 id="settingsTitle">牌桌设置</h2><button class="close-btn" type="button" onclick="closeModal('settingsModal')">✕</button></div>
    <div class="setting-row"><div class="setting-copy"><b>沉浸结算</b><span>显示收租关系、称号和天气效果</span></div><button class="switch" id="effectsSwitch" type="button" aria-label="切换沉浸结算" onclick="toggleSetting('effects')"></button></div>
    <div class="setting-row"><div class="setting-copy"><b>结算音效</b><span>默认关闭，可先试听确认设备声音</span></div><div class="setting-controls"><button class="preview-btn" type="button" onclick="previewSound()">试听</button><button class="switch" id="soundSwitch" type="button" aria-label="切换结算音效" onclick="toggleSetting('sound')"></button></div></div>
    <div class="sheet-label">头像 / 昵称</div><div class="identity-list" id="identityList"></div>
    <div class="sheet-label">牌桌</div>
    <div class="settings-menu">
      <button class="menu-row" type="button" onclick="openNewGameFromSettings()"><span class="menu-icon">↻</span><span class="menu-copy"><b>新局 / 改人数</b><span>清空本局记录并重新选择人数</span></span><span class="menu-arrow">›</span></button>
      <a class="menu-row" href="./about.html"><span class="menu-icon">?</span><span class="menu-copy"><b>关于 / 帮助</b><span>使用说明与项目入口</span></span><span class="menu-arrow">›</span></a>
    </div>
  </div>
</div>

<div class="modal" id="newGameModal" role="dialog" aria-modal="true" aria-labelledby="newGameTitle" onclick="closeOnBackdrop(event,'newGameModal')">
  <div class="sheet">
    <div class="sheet-head"><h2 id="newGameTitle">新局 / 改人数</h2><button class="close-btn" type="button" onclick="closeModal('newGameModal')">✕</button></div>
    <p class="confirm-copy">开始后会清空本局分数和称号记录，保留人数范围内的玩家标记。</p>
    <div class="picker-grid" id="countPicker"></div>
    <button class="wide-primary" style="margin-top:16px" type="button" onclick="startNewGame()">开始新一局</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var DEFAULT_PLAYERS = { 3:['A','B','C'], 4:['A','B','C','D'], 5:['A','B','C','D','E'], 6:['A','B','C','D','E','F'] };
var SCORE_RANGE = { 3:20, 4:20, 5:25, 6:30 };
var SYMBOLS = ['🦊','🐼','🐯','🐸','🐵','🐙','🦄','🐧','🐲','🍉','🍊','🌶️','🀄','🃏','♠️','♥️','🌙','⭐'];
var PERSONA = { '🦊':'狐狐绕后，悄悄把账收齐了。', '🐼':'熊猫不急，竹笋和分数一起打包。', '🐯':'虎虎一抬手，今晚的风向就变了。', '🐸':'蛙声一响，牌桌余额开始搬家。', '🐙':'八只手一起收，效率很合理。', '🐲':'龙王路过，顺手调了一场天气。' };
var storedPlayerCount = parseInt(localStorage.getItem('cardPlayerCount'),10);
var playerCount = DEFAULT_PLAYERS[storedPlayerCount] ? storedPlayerCount : 4;
var players = readJSON('cardPlayers', DEFAULT_PLAYERS[playerCount].slice());
var totals = [], currentScores = [], rounds = [], roundMeta = [], userTouched = [];
var settings = readJSON('cardSettings', { effects:true, sound:false });
if (typeof settings.effects !== 'boolean') settings.effects = true;
if (typeof settings.sound !== 'boolean') settings.sound = false;
var showAll = false, editingPlayer = -1, viewingPlayer = -1, autoCalcIndex = -1, autoCalcLocked = false;
var pendingCount = playerCount, bombWinner = 0, bombRate = 2, quickWinner = 0, pendingRoundMeta = null;
var settlementTimer = null, settlementExitTimer = null, soundHintShown = false, audioContext = null;

function readJSON(key, fallback) { try { var v = JSON.parse(localStorage.getItem(key)); return v === null ? fallback : v; } catch (e) { return fallback; } }
function makeArray(n, val) { return Array.from({length:n}, function(){ return val; }); }
function getRange() { return SCORE_RANGE[playerCount] || 20; }
function signed(n) { return n > 0 ? '+' + n : String(n); }
function scoreClass(n) { return n > 0 ? 'positive' : n < 0 ? 'negative' : 'zero'; }
function getScores(round) { return Array.isArray(round) ? round : (round && Array.isArray(round.scores) ? round.scores : []); }
function normalizeMeta(meta) { return meta && meta.type === 'bomb' && Number.isInteger(meta.winner) && meta.winner >= 0 && meta.winner < playerCount && (meta.rate === 2 || meta.rate === 4) ? {type:'bomb',winner:meta.winner,rate:meta.rate} : null; }

function init() {
  if (!DEFAULT_PLAYERS[playerCount]) playerCount = 4;
  if (!Array.isArray(players) || players.length !== playerCount) players = DEFAULT_PLAYERS[playerCount].slice();
  totals = makeArray(playerCount,0); currentScores = makeArray(playerCount,0); userTouched = makeArray(playerCount,false);
  var state = readJSON('cardGameState', {});
  if (Array.isArray(state.totals) && state.totals.length === playerCount) totals = state.totals;
  if (Array.isArray(state.rounds) && (!state.rounds.length || getScores(state.rounds[0]).length === playerCount)) rounds = state.rounds;
  roundMeta = Array.isArray(state.roundMeta) ? state.roundMeta.slice(0,rounds.length).map(normalizeMeta) : [];
  while (roundMeta.length < rounds.length) roundMeta.push(null);
  saveState(); renderPlayers(); renderHistory(); updateSettingsUI();
}
function saveState() {
  localStorage.setItem('cardPlayers', JSON.stringify(players));
  localStorage.setItem('cardPlayerCount', String(playerCount));
  localStorage.setItem('cardSettings', JSON.stringify(settings));
  localStorage.setItem('cardGameState', JSON.stringify({ totals:totals, rounds:rounds, roundMeta:roundMeta }));
}

function renderPlayers(keepCurrent) {
  var keptScores = keepCurrent && currentScores.length === playerCount ? currentScores.slice() : null;
  var keptTouched = keepCurrent && userTouched.length === playerCount ? userTouched.slice() : null;
  var root = document.getElementById('playerRows'); root.innerHTML = '';
  for (var i=0;i<playerCount;i++) {
    var row = document.createElement('div'); row.className = 'player-row'; row.id = 'row-' + i;
    var rank = getRankInfo(i);
    var ac = document.createElement('div'); ac.className = 'avatar-cell' + (rank ? ' rank-' + rank.rank : '');
    var av = document.createElement('button'); av.type = 'button'; av.className = 'avatar'; av.textContent = players[i]; av.setAttribute('aria-label','查看玩家' + (i+1) + '的个人战报');
    (function(idx){ av.onclick = function(){ openPlayerProfile(idx); }; })(i);
    if(rank){var medal=document.createElement('span');medal.className='rank-medal';medal.textContent=rank.rank;ac.appendChild(medal);}
    var hint = document.createElement('span'); hint.className = 'avatar-hint'; hint.textContent = '玩家 ' + (i+1);
    ac.append(av,hint);
    var tw = document.createElement('div'); tw.className = 'total-wrap';
    var total = document.createElement('div'); total.className = 'total-score mono ' + scoreClass(totals[i]); total.id = 'total-' + i; total.textContent = totals[i];
    var playerTitle=getPlayerTitle(i), title = document.createElement('div'); title.className = 'player-title'+((!rounds.length||playerTitle.indexOf('再赢一轮')===0)?' empty':''); title.textContent = playerTitle;
    tw.append(total,title);
    var wc = document.createElement('div'); wc.className = 'wheel-cell';
    var wheel = document.createElement('div'); wheel.className = 'wheel-container'; wheel.id = 'wheel-' + i;
    var indicator = document.createElement('div'); indicator.className = 'wheel-indicator';
    var track = document.createElement('div'); track.className = 'wheel-track'; track.id = 'track-' + i;
    for (var v=getRange();v>=-getRange();v--) {
      var item = document.createElement('div'); item.className = 'wheel-item'; item.dataset.value = v; item.textContent = signed(v);
      item.style.color = v > 0 ? 'var(--coral)' : v < 0 ? 'var(--mint)' : '#777188'; track.appendChild(item);
    }
    wheel.append(indicator,track); wc.appendChild(wheel);
    var flash = document.createElement('div'); flash.className = 'score-flash'; flash.id = 'flash-' + i;
    row.append(ac,tw,wc,flash); root.appendChild(row); setupWheel(i); setWheelValue(i,0,false);
  }
  resetAutoCalc();
  if (keptScores) {
    for (var k=0;k<playerCount;k++) setWheelValue(k,keptScores[k],false);
    userTouched = keptTouched;
    checkAutoCalc();
  }
}

var ITEM_H = 34;
function valueToIndex(v) { return getRange() - v; }
function indexToValue(i) { return getRange() - i; }
function setWheelValue(pi,value,animate) {
  value = Math.max(-getRange(),Math.min(getRange(),value));
  var track = document.getElementById('track-' + pi), idx = valueToIndex(value);
  track.style.transition = animate ? 'transform .3s cubic-bezier(.22,1,.36,1)' : 'none';
  track.style.transform = 'translateY(' + (-(idx*ITEM_H)+ITEM_H) + 'px)'; currentScores[pi] = value;
  var wheel = document.getElementById('wheel-' + pi); wheel.setAttribute('aria-valuenow',String(value)); wheel.setAttribute('aria-valuetext',signed(value)+' 分');
  Array.from(track.children).forEach(function(el,j){ el.classList.toggle('active',j===idx); el.classList.toggle('adjacent',Math.abs(j-idx)===1); });
}
function setupWheel(pi) {
  var wheel = document.getElementById('wheel-' + pi), startY=0, startOffset=0, dragging=false, lastY=0, velocity=0, lastTime=0;
  wheel.setAttribute('role','slider'); wheel.setAttribute('tabindex','0'); wheel.setAttribute('aria-label','玩家 '+(pi+1)+' 本轮得分'); wheel.setAttribute('aria-valuemin',String(-getRange())); wheel.setAttribute('aria-valuemax',String(getRange()));
  function offset(){ var m = document.getElementById('track-'+pi).style.transform.match(/translateY\((.+?)px\)/); return m ? parseFloat(m[1]) : ITEM_H; }
  function start(y){ dragging=true; startY=y; startOffset=offset(); velocity=0; lastY=y; lastTime=Date.now(); document.getElementById('track-'+pi).style.transition='none'; }
  function move(y){ if(!dragging)return; var now=Date.now(),dt=now-lastTime; if(dt>0)velocity=(y-lastY)/dt; lastY=y;lastTime=now; var next=startOffset+(y-startY),track=document.getElementById('track-'+pi); track.style.transform='translateY('+next+'px)'; var idx=Math.round(-(next-ITEM_H)/ITEM_H); Array.from(track.children).forEach(function(el,j){el.classList.toggle('active',j===idx);el.classList.toggle('adjacent',Math.abs(j-idx)===1);}); }
  function end(){ if(!dragging)return; dragging=false; var idx=Math.round(-((offset()+velocity*120)-ITEM_H)/ITEM_H); idx=Math.max(0,Math.min(getRange()*2,idx)); setWheelValue(pi,indexToValue(idx),true); userTouched[pi]=true; pendingRoundMeta=null; updateSubmitMode(); if(autoCalcIndex===pi){autoCalcLocked=true;autoCalcIndex=-1;clearAutoHighlight();} if(!autoCalcLocked)checkAutoCalc(); }
  function cancel(){ if(!dragging)return; dragging=false; setWheelValue(pi,currentScores[pi],true); }
  function stepBy(delta){setWheelValue(pi,currentScores[pi]+delta,true);userTouched[pi]=true;pendingRoundMeta=null;updateSubmitMode();if(autoCalcIndex===pi){autoCalcLocked=true;autoCalcIndex=-1;clearAutoHighlight();}if(!autoCalcLocked)checkAutoCalc();}
  wheel.addEventListener('touchstart',function(e){e.preventDefault();start(e.touches[0].clientY);},{passive:false});
  wheel.addEventListener('touchmove',function(e){e.preventDefault();move(e.touches[0].clientY);},{passive:false}); wheel.addEventListener('touchend',end); wheel.addEventListener('touchcancel',cancel);
  wheel.addEventListener('mousedown',function(e){e.preventDefault();start(e.clientY);function mm(ev){move(ev.clientY);}function mu(){end();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);}document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
  wheel.addEventListener('keydown',function(e){if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();stepBy(1);}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();stepBy(-1);}else if(e.key==='Home'){e.preventDefault();stepBy(-currentScores[pi]);}});
}
function clearAutoHighlight(){ Array.from(document.querySelectorAll('.player-row')).forEach(function(r){r.classList.remove('auto-highlighted');}); }
function resetAutoCalc(){ autoCalcIndex=-1;autoCalcLocked=false;userTouched=makeArray(playerCount,false);clearAutoHighlight(); }
function checkAutoCalc(){
  if(autoCalcLocked)return; if(autoCalcIndex!==-1){document.getElementById('row-'+autoCalcIndex).classList.remove('auto-highlighted');autoCalcIndex=-1;}
  var touched=userTouched.filter(Boolean).length; if(touched!==playerCount-1)return;
  var idx=userTouched.indexOf(false), sum=currentScores.reduce(function(a,b){return a+b;},0), autoValue=currentScores[idx]-sum;
  if(Math.abs(autoValue)<=getRange()){autoCalcIndex=idx;setWheelValue(idx,autoValue,true);document.getElementById('row-'+idx).classList.add('auto-highlighted');}
}

function submitScores(){
  var sum=currentScores.reduce(function(a,b){return a+b;},0); if(sum!==0){showToast('分数之和不是 0（当前 '+signed(sum)+'）');return;}
  if(currentScores.every(function(v){return v===0;})){showToast('这一轮还没有分数');return;}
  var settledScores=currentScores.slice(), meta=pendingRoundMeta ? Object.assign({},pendingRoundMeta) : null;
  rounds.push(settledScores); roundMeta.push(meta);
  for(var i=0;i<playerCount;i++){var old=totals[i];totals[i]+=settledScores[i];animateTotal(i,old,totals[i]);var flash=document.getElementById('flash-'+i);flash.className='score-flash '+(settledScores[i]>=0?'pos':'neg');void flash.offsetWidth;flash.classList.add('show');}
  pendingRoundMeta=null; updateSubmitMode(); for(var j=0;j<playerCount;j++)setWheelValue(j,0,true); resetAutoCalc(); saveState(); renderHistory(); refreshPlayerTitles();
  var analysis=analyzeRound(settledScores,meta); playSettlementSound(analysis.tier,false,analysis.title); if(settings.effects)showSettlement(settledScores,meta,analysis); else showToast(analysis.title+' · '+analysis.caption);
}

function analyzeRound(scores,meta){

  else if(streak.count===4){callout='主宰牌桌';title='四连主宰';caption='节奏完全接管，连胜还在继续。';}

  else if(tier==='large'){callout='势不可挡';title='无人可挡';caption='单轮 +'+max+'，这一波节奏拉满。';}

  var achievements=[];winners.forEach(function(i){var s=getStreak(i),bombs=getBombWins(i);if(s.count>=2)achievements.push(s.count+' 连胜');if(bombs===3)achievements.push('解锁爆破王牌');if(bombs>=5)achievements.push('爆破宗师 ×'+bombs);});if(tier==='epic'&&losers.length===playerCount-1)achievements.push('本轮王牌 · 横扫全桌');if(priorLoss>=3)achievements.push('终结连败 · 强势回归');

function openBombModal(){bombWinner=0;bombRate=2;renderBombPicker();openModal('bombModal');}
function renderBombPicker(){var wp=document.getElementById('bombWinnerPicker');wp.innerHTML='';for(var i=0;i<playerCount;i++){var b=document.createElement('button');b.type='button';b.className='picker-option'+(i===bombWinner?' selected':'');b.textContent=players[i]+' · 玩家 '+(i+1);(function(idx){b.onclick=function(){bombWinner=idx;renderBombPicker();};})(i);wp.appendChild(b);}var rp=document.getElementById('bombRatePicker');rp.innerHTML='';[2,4].forEach(function(rate){var b=document.createElement('button');b.type='button';b.className='picker-option'+(rate===bombRate?' selected':'');b.textContent='每人 '+rate+' 分';b.onclick=function(){bombRate=rate;renderBombPicker();};rp.appendChild(b);});document.getElementById('bombPreview').textContent=players[bombWinner]+' 获得 +'+(bombRate*(playerCount-1))+'，其余每人 -'+bombRate+'。炸弹会单独记入历史和称号。';}
function applyBomb(){for(var i=0;i<playerCount;i++)setWheelValue(i,i===bombWinner?bombRate*(playerCount-1):-bombRate,true);pendingRoundMeta={type:'bomb',winner:bombWinner,rate:bombRate};userTouched=makeArray(playerCount,true);clearAutoHighlight();closeModal('bombModal');submitScores();}
function updateSubmitMode(){var btn=document.getElementById('submitBtn');btn.classList.remove('bomb-ready');btn.textContent='提交分数';}

function openQuickModal(){quickWinner=0;var highest=Math.max.apply(null,totals);if(rounds.length)quickWinner=totals.indexOf(highest);renderQuickPicker();openModal('quickModal');}
function renderQuickPicker(){
  var wp=document.getElementById('quickWinnerPicker');wp.innerHTML='';for(var i=0;i<playerCount;i++){var b=document.createElement('button');b.type='button';b.className='picker-option'+(i===quickWinner?' selected':'');b.textContent=players[i]+' · 玩家 '+(i+1);(function(idx){b.onclick=function(){quickWinner=idx;renderQuickPicker();};})(i);wp.appendChild(b);}
  var sp=document.getElementById('quickScorePicker');sp.innerHTML='';[2,3,4,6,8,10].filter(function(v){return v<=getRange();}).forEach(function(score){var b=document.createElement('button');b.type='button';b.className='quick-score';b.innerHTML='+'+score+'<small>自动均摊</small>';b.onclick=function(){applyQuickScore(score);};sp.appendChild(b);});document.getElementById('quickPreview').textContent='选定 '+players[quickWinner]+' 为赢家。点击得分后自动均摊，回到牌桌仍可微调。';
}
function applyQuickScore(score){
  var losers=[];for(var i=0;i<playerCount;i++)if(i!==quickWinner)losers.push(i);var base=Math.floor(score/losers.length),remainder=score%losers.length,start=rounds.length%losers.length;
  for(var p=0;p<playerCount;p++)setWheelValue(p,p===quickWinner?score:0,true);
  for(var j=0;j<losers.length;j++){var extra=((j-start+losers.length)%losers.length)<remainder?1:0;setWheelValue(losers[j],-(base+extra),true);}
  pendingRoundMeta=null;userTouched=makeArray(playerCount,true);clearAutoHighlight();updateSubmitMode();closeModal('quickModal');showToast(players[quickWinner]+' +'+score+' 已均摊，可微调后提交');
}

function openSettings(){renderIdentityList();updateSettingsUI();openModal('settingsModal');}
function renderIdentityList(){var root=document.getElementById('identityList');if(!root)return;root.innerHTML='';for(var i=0;i<playerCount;i++){var b=document.createElement('button');b.type='button';b.className='identity-item';b.textContent=players[i]+' · 玩家 '+(i+1);(function(idx){b.onclick=function(){closeModal('settingsModal');openIdentityModal(idx);};})(i);root.appendChild(b);}}
function toggleSetting(key){settings[key]=!settings[key];saveState();updateSettingsUI();if(key==='sound'){if(settings.sound){showToast('🔊 音效与中文播报已开启');playSettlementSound('medium',true);setTimeout(function(){speakTitle('火力全开');},180);}else{if(window.speechSynthesis)window.speechSynthesis.cancel();showToast('🔇 音效已关闭');}}}
function previewSound(){showToast('🔊 试听：超神时刻');playSettlementSound('epic',true);setTimeout(function(){speakTitle('超神时刻',true);},180);}
function updateSettingsUI(){var effects=document.getElementById('effectsSwitch'),sound=document.getElementById('soundSwitch');effects.classList.toggle('on',settings.effects);sound.classList.toggle('on',settings.sound);effects.setAttribute('aria-pressed',String(settings.effects));sound.setAttribute('aria-pressed',String(settings.sound));}
function openNewGameFromSettings(){closeModal('settingsModal');openNewGameModal();}
function openNewGameModal(){pendingCount=playerCount;renderCountPicker();openModal('newGameModal');}
function renderCountPicker(){var root=document.getElementById('countPicker');root.innerHTML='';[3,4,5,6].forEach(function(n){var b=document.createElement('button');b.type='button';b.className='picker-option'+(n===pendingCount?' selected':'');b.textContent=n+' 人';b.onclick=function(){pendingCount=n;renderCountPicker();};root.appendChild(b);});}
function startNewGame(){var previous=players.slice();playerCount=pendingCount;players=DEFAULT_PLAYERS[playerCount].map(function(v,i){return previous[i]||v;});totals=makeArray(playerCount,0);currentScores=makeArray(playerCount,0);rounds=[];roundMeta=[];showAll=false;pendingRoundMeta=null;saveState();closeModal('newGameModal');renderPlayers();renderHistory();updateSubmitMode();showToast(playerCount+' 人 · 新一局开始');}

function openModal(id){var modal=document.getElementById(id);modal._returnFocus=document.activeElement;modal.classList.add('active');var focusable=modal.querySelector('button,input');if(focusable)requestAnimationFrame(function(){focusable.focus();});}
function closeModal(id){var modal=document.getElementById(id);modal.classList.remove('active');if(modal._returnFocus&&document.contains(modal._returnFocus))modal._returnFocus.focus();}
function closeOnBackdrop(event,id){if(event.target===event.currentTarget)closeModal(id);}
function showToast(message){var t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(function(){t.classList.remove('show');},2000);}
function escapeHTML(value){return String(value).replace(/[&<>'"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch];});}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeSettlement();Array.from(document.querySelectorAll('.modal.active')).forEach(function(m){closeModal(m.id);});return;}
  var modal=document.querySelector('.modal.active');if(!modal||e.key!=='Tab')return;var focusable=Array.from(modal.querySelectorAll('button:not([disabled]),input:not([disabled])')).filter(function(el){return el.offsetParent!==null;});if(!focusable.length)return;var first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
init();
</script>
</body>
</html>
