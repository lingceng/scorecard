name: Render About Page

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/render-about.mjs
      - .github/workflows/render-about.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-about:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render about.html from README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/render-about.mjs

      - name: Commit generated about.html
        run: |
          if git diff --quiet -- about.html; then
            echo "No changes to about.html"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "自动更新 about.html"
          git push
